<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hit The Gym Lil Bro AI Calorie and Exercise Coach</title>
<style>
:root{--bg:#0b0d12;--card:#151821;--card2:#1b1f2a;--border:#262b38;--accent:#22c55e;--accent2:#38bdf8;--accent3:#a78bfa;--accent4:#f472b6;--text:#f1f5f9;--muted:#8b94a7;--danger:#f87171;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{max-width:780px;margin:0 auto;padding:16px 16px 60px;}
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin:0 -16px 12px;flex-wrap:wrap;gap:8px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:19px;}
.brand h1{font-size:1rem;margin:0;font-weight:800;line-height:1.15;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--card2);cursor:pointer;font-size:16px;color:var(--text);}
.streak-badge{display:flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:8px 12px;font-size:.8rem;font-weight:700;color:var(--accent);}
.profile-pill{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:7px 12px;font-size:.78rem;font-weight:700;color:var(--accent3);cursor:pointer;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;}
.btn{padding:12px 20px;border-radius:10px;border:none;background:var(--accent);color:#08110b;font-weight:700;cursor:pointer;width:100%;margin-top:12px;}
.btn.small{width:auto;padding:6px 10px;font-size:.72rem;margin-top:0;}
.btn.secondary{background:var(--card2);color:var(--text);border:1.5px solid var(--border);}
.tabs{display:flex;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:18px;overflow-x:auto;}
.tab{flex:1;text-align:center;padding:9px 8px;border-radius:9px;cursor:pointer;font-size:.76rem;font-weight:600;color:var(--muted);white-space:nowrap;}
.tab.active{background:var(--card);color:var(--text);}
.panel{display:none;}
.panel.active{display:block;}
.leaderboard-row{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;font-size:.85rem;}
.leaderboard-row.me{border-color:var(--accent);}
.lb-top{display:grid;grid-template-columns:34px 1fr 55px 70px 50px;gap:8px;align-items:center;}
.lb-admin-controls{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;margin-top:6px;border-top:1px solid var(--border);}
.empty-state{text-align:center;color:var(--muted);font-size:.82rem;padding:16px 0;}
.errbox{background:#3a1414;border:1px solid #7f1d1d;color:#fca5a5;border-radius:10px;padding:12px 14px;font-size:.85rem;}
</style>
</head>
<body data-theme="dark">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCCwk6PckNFfpBV15vBOafYcvM4n64shnU",authDomain:"food-counter-app-fedc4.firebaseapp.com",projectId:"food-counter-app-fedc4",storageBucket:"food-counter-app-fedc4.firebasestorage.app",messagingSenderId:"969779642326",appId:"1:969779642326:web:1edd42a9bddab7ed74ee77"};
const fbApp=initializeApp(firebaseConfig);
const fbAuth=getAuth(fbApp);
const fbDb=getFirestore(fbApp);
window.fbReady=new Promise(function(resolve,reject){
let settled=false;
const timeout=setTimeout(function(){ if(!settled){ settled=true; reject(new Error('Connection timed out.')); } },8000);
signInAnonymously(fbAuth).then(function(cred){ if(!settled){ settled=true; clearTimeout(timeout); resolve(cred.user); } }).catch(function(err){ if(!settled){ settled=true; clearTimeout(timeout); reject(err); } });
onAuthStateChanged(fbAuth,function(user){ if(user&&!settled){ settled=true; clearTimeout(timeout); resolve(user); } });
});
window.fbGetPlayer=async function(name){ await window.fbReady; const ref=doc(fbDb,'players',name.toLowerCase()); const snap=await getDoc(ref); return snap.exists()?snap.data():null; };
window.fbSavePlayer=async function(name,pin,dataObj){ await window.fbReady; const ref=doc(fbDb,'players',name.toLowerCase()); await setDoc(ref,{pin:pin,data:dataObj,displayName:name,updatedAt:Date.now()},{merge:true}); };
window.fbCreatePlayer=async function(name,pin){ await window.fbReady; const ref=doc(fbDb,'players',name.toLowerCase()); await setDoc(ref,{pin:pin,data:{},displayName:name,createdAt:Date.now()}); };
window.fbGetLeaderboard=async function(){ await window.fbReady; const snap=await getDocs(collection(fbDb,'players')); const rows=[]; snap.forEach(function(d){ rows.push({id:d.id,data:d.data()}); }); return rows; };
window.fbGetConfig=async function(){ await window.fbReady; const ref=doc(fbDb,'config','shared'); const snap=await getDoc(ref); return snap.exists()?snap.data():null; };
window.fbSetConfig=async function(provider,key){ await window.fbReady; const ref=doc(fbDb,'config','shared'); await setDoc(ref,{provider:provider,key:key,updatedAt:Date.now()}); };
window.fbDeletePlayer=async function(id){ await window.fbReady; const ref=doc(fbDb,'players',id); await deleteDoc(ref); };
window.fbAdjustPlayerXP=async function(id, delta){
  await window.fbReady;
  const ref=doc(fbDb,'players',id);
  const snap=await getDoc(ref);
  if(!snap.exists()) throw new Error('Player not found');
  const playerDoc=snap.data();
  const dataBlob=playerDoc.data||{};
  const xpKey=Object.keys(dataBlob).find(function(k){ return k.endsWith('__xp'); });
  if(!xpKey) throw new Error('No XP record found for this player yet.');
  const current=+dataBlob[xpKey]||0;
  const updated=Math.max(0, current+delta);
  dataBlob[xpKey]=String(updated);
  await setDoc(ref,{data:dataBlob,updatedAt:Date.now(),adminActionAt:Date.now()},{merge:true});
  return updated;
};
window.fbFullResetPlayer=async function(id){
  await window.fbReady;
  const ref=doc(fbDb,'players',id);
  const snap=await getDoc(ref);
  if(!snap.exists()) throw new Error('Player not found');
  await setDoc(ref,{data:{},adminActionAt:Date.now()},{merge:true});
};
</script>
<div class="app">
<div class="topbar">
<div class="brand"><div class="logo">GYM</div><h1>Hit The Gym Lil Bro</h1></div>
<div class="topbar-actions"><div class="profile-pill" id="profilePill" onclick="openProfileSwitcher()">Player 1</div><div class="streak-badge" id="streakBadge">0</div><button class="icon-btn" id="syncNowBtn" onclick="forceSyncNow()" title="Sync now">Sync</button></div>
</div>
<div class="tabs">
<div class="tab active" data-tab="profile" onclick="showTab('profile')">Profile</div>
<div class="tab" data-tab="leaderboard" onclick="showTab('leaderboard')">Leaderboard</div>
</div>
<div class="panel active" id="panel-profile">
<div class="card"><h2>Level <span id="levelBadgeNum">1</span></h2><p id="xpText">0 / 100 XP</p></div>
<div class="card"><button class="btn" onclick="addXP(10,'test')">Log Activity (+10 XP demo)</button></div>
</div>
<div class="panel" id="panel-leaderboard">
<div class="card"><h2>Leaderboard</h2><div class="btn secondary" style="width:auto;display:inline-block;" onclick="renderLeaderboard()">Refresh</div> <div class="btn secondary" style="width:auto;display:inline-block;" onclick="unlockAdmin()">Admin</div><div id="leaderboardWrap" style="margin-top:14px;"></div></div>
</div>
</div>
<div id="profileModalRoot"></div>
<script>
function ns(key){ return getActiveProfile()+'__'+key; }
function getProfiles(){ return JSON.parse(localStorage.getItem('gymapp_profiles')||'["Player 1"]'); }
function saveProfiles(list){ localStorage.setItem('gymapp_profiles',JSON.stringify(list)); }
function getActiveProfile(){ return localStorage.getItem('gymapp_active_profile')||'Player 1'; }
function setActiveProfile(name){ localStorage.setItem('gymapp_active_profile',name); location.reload(); }
function cloudPinKeyFor(name){ return 'cloudpin__'+name; }
function hasCloudLink(name){ return localStorage.getItem(cloudPinKeyFor(name))!==null; }
function getCloudPin(name){ return localStorage.getItem(cloudPinKeyFor(name)); }
let syncTimeout=null;
function queueCloudSync(){ const name=getActiveProfile(); if(!hasCloudLink(name)) return; clearTimeout(syncTimeout); syncTimeout=setTimeout(function(){ doCloudSync(name); },800); }
async function doCloudSync(name){ const pin=getCloudPin(name); const prefix=name+'__'; const dataObj={}; Object.keys(localStorage).filter(function(k){ return k.startsWith(prefix); }).forEach(function(k){ dataObj[k]=localStorage.getItem(k); }); await window.fbSavePlayer(name,pin,dataObj); }
async function reconcileWithCloud(name){
  try{
    const player=await window.fbGetPlayer(name);
    if(!player) return false;
    const adminActionAt=player.adminActionAt||0;
    const ackKey='adminack__'+name.toLowerCase();
    const ack=+(localStorage.getItem(ackKey)||0);
    if(adminActionAt>ack){
      const cloudData=player.data||{};
      const prefix=name+'__';
      Object.keys(localStorage).filter(function(k){ return k.startsWith(prefix); }).forEach(function(k){ localStorage.removeItem(k); });
      Object.keys(cloudData).forEach(function(k){ localStorage.setItem(k,cloudData[k]); });
      localStorage.setItem(ackKey,String(adminActionAt));
      return true;
    }
  }catch(e){ console.error('reconcile failed',e); }
  return false;
}
async function forceSyncNow(){
  const name=getActiveProfile();
  const btn=document.getElementById('syncNowBtn');
  if(!hasCloudLink(name)){ alert('Sign in first to enable cloud sync.'); return; }
  clearTimeout(syncTimeout);
  if(btn) btn.textContent='...';
  try{
    const changed=await reconcileWithCloud(name);
    if(changed){ alert('Your account was updated by an admin. Reloading to apply it.'); location.reload(); return; }
    await doCloudSync(name);
    if(btn) btn.textContent='OK';
    setTimeout(function(){ if(btn) btn.textContent='Sync'; },1500);
    if(document.getElementById('panel-leaderboard').classList.contains('active')){ renderLeaderboard(); }
  }catch(err){ if(btn) btn.textContent='Sync'; alert('Sync failed: '+err.message); }
}
window.addEventListener('beforeunload', function(){ const name=getActiveProfile(); if(hasCloudLink(name)){ doCloudSync(name); } });
document.addEventListener('visibilitychange', function(){ const name=getActiveProfile(); if(!hasCloudLink(name)) return; if(document.visibilityState==='hidden'){ doCloudSync(name); } else if(document.visibilityState==='visible'){ reconcileWithCloud(name).then(function(changed){ if(changed) location.reload(); }); } });
async function cloudSignIn(){ const nameInput=document.getElementById('cloudNameInput'); const pinInput=document.getElementById('cloudPinInput'); const statusEl=document.getElementById('cloudLoginStatus'); const name=nameInput.value.trim(); const pin=pinInput.value.trim(); if(!name||!pin){ statusEl.textContent='Enter both your name and a code.'; return; } statusEl.textContent='Connecting...'; try{ const existing=await window.fbGetPlayer(name); if(existing){ if(existing.pin!==pin){ statusEl.textContent='That name is taken with a different code.'; return; } const cloudData=existing.data||{}; Object.keys(cloudData).forEach(function(k){ localStorage.setItem(k,cloudData[k]); }); statusEl.textContent='Welcome back!'; } else { await window.fbCreatePlayer(name,pin); statusEl.textContent='Account created!'; } localStorage.setItem(cloudPinKeyFor(name),pin); const list=getProfiles(); if(!list.includes(name)){ list.push(name); saveProfiles(list); } setTimeout(function(){ setActiveProfile(name); },500); } catch(err){ statusEl.textContent='Connection error: '+err.message; } }
function openProfileSwitcher(){ const profiles=getProfiles().filter(function(n){ return hasCloudLink(n); }); const active=getActiveProfile(); const root=document.getElementById('profileModalRoot'); root.innerHTML=''; const box=document.createElement('div'); box.style.position='fixed'; box.style.inset='0'; box.style.background='rgba(0,0,0,.7)'; box.style.display='flex'; box.style.alignItems='center'; box.style.justifyContent='center'; box.innerHTML='<div style="background:#151821;padding:20px;border-radius:14px;max-width:300px;width:90%;"><h3>Sign in</h3><input id="cloudNameInput" placeholder="Your name" style="width:100%;margin-bottom:8px;padding:10px;"><input id="cloudPinInput" type="password" placeholder="Code" style="width:100%;margin-bottom:8px;padding:10px;"><button class="btn" onclick="cloudSignIn()">Go</button><p id="cloudLoginStatus" style="font-size:.75rem;color:#8b94a7;"></p><button class="btn secondary" onclick="document.getElementById(\'profileModalRoot\').innerHTML=\'\'">Close</button></div>'; root.appendChild(box); }
const ADMIN_PASSPHRASE='GymAdmin2026';
let isAdmin=sessionStorage.getItem('gymapp_admin')==='1';
function unlockAdmin(){ const pass=prompt('Admin passphrase:'); if(pass===null) return; if(pass===ADMIN_PASSPHRASE){ isAdmin=true; sessionStorage.setItem('gymapp_admin','1'); alert('Admin mode unlocked.'); renderLeaderboard(); } else { alert('Wrong passphrase.'); } }
async function removePlayer(id,name){ if(!confirm('Remove '+name+'?')) return; try{ await window.fbDeletePlayer(id); renderLeaderboard(); }catch(err){ alert('Failed: '+err.message); } }
async function adjustXP(id,name,delta){ try{ await window.fbAdjustPlayerXP(id,delta); renderLeaderboard(); }catch(err){ alert('Failed: '+err.message); } }
async function customAdjustXP(id,name){ const raw=prompt('XP amount (negative to remove):'); if(raw===null) return; const amount=parseInt(raw,10); if(isNaN(amount)){ alert('Enter a valid number.'); return; } adjustXP(id,name,amount); }
async function resetPlayerLevel(id,name){ if(!confirm('Reset '+name+"'s entire account (XP, streaks, weight log, PRs) to a blank Level 1? This can't be undone and will also apply on their own device.")) return; try{ await window.fbFullResetPlayer(id); renderLeaderboard(); }catch(err){ alert('Failed: '+err.message); } }
function showTab(name){ document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active',t.dataset.tab===name); }); document.querySelectorAll('.panel').forEach(function(p){ p.classList.toggle('active',p.id==='panel-'+name); }); if(name==='leaderboard') renderLeaderboard(); }
function xpFromDataBlob(dataBlob){ const key=Object.keys(dataBlob).find(function(k){ return k.endsWith('__xp'); }); return key?(+dataBlob[key]||0):0; }
async function renderLeaderboard(){ const wrap=document.getElementById('leaderboardWrap'); wrap.innerHTML='<div class="empty-state">Loading...</div>'; try{ const rows=await window.fbGetLeaderboard(); const active=getActiveProfile(); const list=rows.map(function(r){ const blob=r.data||{}; return { id:r.id, name: blob.displayName||r.id, xp: xpFromDataBlob(blob.data||{}) }; }).sort(function(a,b){ return b.xp-a.xp; }); wrap.innerHTML=''; if(list.length===0){ wrap.innerHTML='<div class="empty-state">No players yet.</div>'; return; } list.forEach(function(p,idx){ const info=levelForXP(p.xp); const row=document.createElement('div'); row.className='leaderboard-row'+(p.name.toLowerCase()===active.toLowerCase()?' me':''); const top=document.createElement('div'); top.className='lb-top'; top.innerHTML='<span>#'+(idx+1)+'</span><span>'+p.name+'</span><span>Lv '+info.level+'</span><span>'+p.xp+' XP</span><span></span>'; row.appendChild(top); if(isAdmin){ const controls=document.createElement('div'); controls.className='lb-admin-controls'; const addBtn=document.createElement('button'); addBtn.className='btn small'; addBtn.textContent='+10 XP'; addBtn.addEventListener('click',function(){ adjustXP(p.id,p.name,10); }); const subBtn=document.createElement('button'); subBtn.className='btn small secondary'; subBtn.textContent='-10 XP'; subBtn.addEventListener('click',function(){ adjustXP(p.id,p.name,-10); }); const customBtn=document.createElement('button'); customBtn.className='btn small secondary'; customBtn.textContent='Custom'; customBtn.addEventListener('click',function(){ customAdjustXP(p.id,p.name); }); const resetBtn=document.createElement('button'); resetBtn.className='btn small secondary'; resetBtn.textContent='Reset'; resetBtn.addEventListener('click',function(){ resetPlayerLevel(p.id,p.name); }); const delBtn=document.createElement('button'); delBtn.className='btn small secondary'; delBtn.textContent='Remove'; delBtn.addEventListener('click',function(){ removePlayer(p.id,p.name); }); controls.appendChild(addBtn); controls.appendChild(subBtn); controls.appendChild(customBtn); controls.appendChild(resetBtn); controls.appendChild(delBtn); row.appendChild(controls); } wrap.appendChild(row); }); } catch(err){ wrap.innerHTML='<div class="errbox">Could not load leaderboard: '+err.message+'</div>'; } }
function getXP(){ return +(localStorage.getItem(ns('xp'))||0); }
function addXP(amount){ const before=getXP(); const after=before+amount; localStorage.setItem(ns('xp'),after); renderLevelBar(); queueCloudSync(); }
function levelForXP(xp){ const level=Math.min(10,Math.floor(xp/100)+1); const xpIntoLevel=xp%100; return {level,xpIntoLevel}; }
function renderLevelBar(){ const xp=getXP(); const info=levelForXP(xp); document.getElementById('levelBadgeNum').textContent=info.level; document.getElementById('xpText').textContent=info.xpIntoLevel+' / 100 XP'; document.getElementById('streakBadge').textContent=xp; }
(async function initApp(){
  const active=getActiveProfile();
  document.getElementById('profilePill').textContent=active+(hasCloudLink(active)?' (cloud)':'');
  if(!hasCloudLink(active)){ setTimeout(openProfileSwitcher,400); }
  if(hasCloudLink(active)){
    const changed=await reconcileWithCloud(active);
    if(changed){ location.reload(); return; }
  }
  renderLevelBar();
  if(hasCloudLink(active)){ doCloudSync(active); }
})();
</script>
</body>
</html>

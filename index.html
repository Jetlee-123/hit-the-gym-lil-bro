<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hit The Gym Lil Bro — AI Calorie & Exercise Coach</title>
<style>
:root{--bg:#0b0d12;--card:#151821;--card2:#1b1f2a;--border:#262b38;--accent:#22c55e;--accent2:#38bdf8;--accent3:#a78bfa;--accent4:#f472b6;--text:#f1f5f9;--muted:#8b94a7;--danger:#f87171;--radius:16px;--shadow:0 8px 28px rgba(0,0,0,.35);}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{max-width:780px;margin:0 auto;padding:16px 16px 60px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:18px;}
.btn{display:inline-flex;padding:13px 26px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#08110b;font-weight:700;cursor:pointer;width:100%;justify-content:center;margin-top:10px;}
input{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);background:var(--card2);color:var(--text);margin-bottom:8px;}
.small{font-size:.78rem;color:var(--muted);}
</style>
</head>
<body>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCCwk6PckNFfpBV15vBOafYcvM4n64shnU",authDomain:"food-counter-app-fedc4.firebaseapp.com",projectId:"food-counter-app-fedc4",storageBucket:"food-counter-app-fedc4.firebasestorage.app",messagingSenderId:"969779642326",appId:"1:969779642326:web:1edd42a9bddab7ed74ee77"};
const fbApp=initializeApp(firebaseConfig);
const fbAuth=getAuth(fbApp);
const fbDb=getFirestore(fbApp);
window.fbReady=new Promise(function(resolve,reject){
let settled=false;
const timeout=setTimeout(function(){ if(!settled){ settled=true; reject(new Error('Connection timed out.')); } },8000);
signInAnonymously(fbAuth).then(function(cred){ if(!settled){ settled=true; clearTimeout(timeout); resolve(cred.user); } }).catch(function(err){ if(!settled){ settled=true; clearTimeout(timeout); reject(err); } });
onAuthStateChanged(fbAuth,function(user){ if(user&&!settled){ settled=true; clearTimeout(timeout); resolve(user); } });
});
window.fbGetPlayer=async function(name){ await window.fbReady; const ref=doc(fbDb,'players',name.toLowerCase()); const snap=await getDoc(ref); return snap.exists()?snap.data():null; };
window.fbSavePlayer=async function(name,pin,dataObj){ await window.fbReady; const ref=doc(fbDb,'players',name.toLowerCase()); await setDoc(ref,{pin:pin,data:dataObj,displayName:name,updatedAt:Date.now()},{merge:true}); };
window.fbCreatePlayer=async function(name,pin){ await window.fbReady; const ref=doc(fbDb,'players',name.toLowerCase()); await setDoc(ref,{pin:pin,data:{},displayName:name,createdAt:Date.now()}); };
window.fbGetLeaderboard=async function(){ await window.fbReady; const snap=await getDocs(collection(fbDb,'players')); const rows=[]; snap.forEach(function(d){ rows.push({id:d.id,data:d.data()}); }); return rows; };
window.fbGetConfig=async function(){ await window.fbReady; const ref=doc(fbDb,'config','shared'); const snap=await getDoc(ref); return snap.exists()?snap.data():null; };
window.fbSetConfig=async function(provider,key){ await window.fbReady; const ref=doc(fbDb,'config','shared'); await setDoc(ref,{provider:provider,key:key,updatedAt:Date.now()}); };
window.fbDeletePlayer=async function(id){ await window.fbReady; const ref=doc(fbDb,'players',id); await deleteDoc(ref); };
</script>
<div class="app">
<div class="card">
<h1>💪 Admin Test Console</h1>
<p class="small">This is a lightweight console to verify the admin + shared key backend before the full UI ships.</p>
<input id="adminPass" type="password" placeholder="Admin passphrase">
<button class="btn" onclick="checkAdmin()">Unlock</button>
<p id="adminStatus" class="small"></p>
<div id="adminTools" style="display:none;margin-top:16px;">
<h3>Set shared AI key</h3>
<input id="provInput" placeholder="gemini or openai" value="gemini">
<input id="keyInput" type="password" placeholder="API key">
<button class="btn" onclick="saveKey()">Save shared key</button>
<p id="keyStatus" class="small"></p>
<h3>Players</h3>
<div id="playersList"></div>
</div>
</div>
</div>
<script>
const ADMIN_PASSPHRASE='GymAdmin2026';
function checkAdmin(){
  const pass=document.getElementById('adminPass').value;
  const statusEl=document.getElementById('adminStatus');
  if(pass===ADMIN_PASSPHRASE){
    statusEl.textContent='Unlocked!';
    document.getElementById('adminTools').style.display='block';
    loadPlayers();
  } else {
    statusEl.textContent='Wrong passphrase.';
  }
}
async function saveKey(){
  const provider=document.getElementById('provInput').value.trim();
  const key=document.getElementById('keyInput').value.trim();
  const statusEl=document.getElementById('keyStatus');
  statusEl.textContent='Saving...';
  try{ await window.fbSetConfig(provider,key); statusEl.textContent='Saved!'; }
  catch(err){ statusEl.textContent='Error: '+err.message; }
}
async function loadPlayers(){
  const wrap=document.getElementById('playersList');
  wrap.innerHTML='Loading...';
  try{
    const rows=await window.fbGetLeaderboard();
    wrap.innerHTML='';
    rows.forEach(function(r){
      const div=document.createElement('div');
      div.style.display='flex';
      div.style.justifyContent='space-between';
      div.style.padding='8px';
      div.style.background='#1b1f2a';
      div.style.marginBottom='6px';
      div.style.borderRadius='8px';
      const span=document.createElement('span');
      span.textContent=(r.data.displayName||r.id);
      const btn=document.createElement('button');
      btn.textContent='Remove';
      btn.onclick=async function(){
        if(confirm('Remove '+(r.data.displayName||r.id)+'?')){
          await window.fbDeletePlayer(r.id);
          loadPlayers();
        }
      };
      div.appendChild(span);
      div.appendChild(btn);
      wrap.appendChild(div);
    });
  } catch(err){ wrap.innerHTML='Error: '+err.message; }
}
</script>
</body>
</html>
